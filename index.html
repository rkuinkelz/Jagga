<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="theme-color" content="#0f2942">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>व्यावसायिक भवन विकास प्रस्ताव | कागेश्वरी मनोहरा</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --navy:#0f2942;--navy-2:#1e3a5f;--gold:#c9a227;--gold-light:#e8c547;
    --teal:#0d9488;--teal-light:#14b8a6;--red:#dc2626;--orange:#ea580c;
    --violet:#7c3aed;--pink:#db2777;--bg:#f5f7fa;--card:#ffffff;
    --text:#1a2332;--muted:#5a6b80;--border:#e2e8f0;
    --shadow-sm:0 1px 2px rgba(15,41,66,.06);
    --shadow:0 4px 14px rgba(15,41,66,.08);
    --shadow-lg:0 12px 36px rgba(15,41,66,.12);
    --radius:14px;
    --safe-bottom:env(safe-area-inset-bottom, 0px);
    --safe-top:env(safe-area-inset-top, 0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth;scroll-padding-top:70px}
  body{
    font-family:'Mukta','Inter',system-ui,sans-serif;
    background:var(--bg);color:var(--text);
    line-height:1.7;font-size:16px;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
    padding-bottom:calc(70px + var(--safe-bottom));
  }

  /* ============ MOBILE TOP BAR ============ */
  .mobile-topbar{
    position:fixed;top:0;left:0;right:0;z-index:200;
    background:rgba(15,41,66,.98);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    padding:calc(8px + var(--safe-top)) 16px 8px;
    display:flex;align-items:center;justify-content:space-between;
    box-shadow:0 2px 12px rgba(0,0,0,.15);
    min-height:56px;
  }
  .mobile-logo{
    display:flex;align-items:center;gap:8px;
    color:#fff;font-weight:800;font-size:14px;
  }
  .mobile-logo-dot{
    width:8px;height:8px;border-radius:50%;background:var(--gold);
    box-shadow:0 0 10px var(--gold);
    animation:pulse 2s infinite;
  }
  .mobile-actions{display:flex;gap:6px}
  .mobile-icon-btn{
    width:38px;height:38px;border-radius:10px;border:none;
    background:rgba(255,255,255,.1);
    color:#fff;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:.2s;
  }
  .mobile-icon-btn:active{transform:scale(.92);background:rgba(255,255,255,.2)}
  .mobile-icon-btn svg{width:18px;height:18px}

  /* ============ BOTTOM NAV ============ */
  .bottom-nav{
    position:fixed;bottom:0;left:0;right:0;z-index:200;
    background:rgba(255,255,255,.98);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-top:1px solid var(--border);
    display:flex;justify-content:space-around;
    padding:6px 4px calc(6px + var(--safe-bottom));
    box-shadow:0 -4px 20px rgba(15,41,66,.08);
  }
  .nav-item{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:6px 4px;border-radius:10px;text-decoration:none;
    color:var(--muted);transition:.2s;cursor:pointer;
    min-width:0;
  }
  .nav-item svg{width:20px;height:20px;stroke-width:2}
  .nav-item span{
    font-size:10px;font-weight:600;letter-spacing:.2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    max-width:100%;
  }
  .nav-item.active{color:var(--navy)}
  .nav-item.active svg{color:var(--gold)}
  .nav-item:active{transform:scale(.95)}

  /* ============ FAB ============ */
  .download-fab{
    position:fixed;
    bottom:calc(80px + var(--safe-bottom));right:16px;z-index:150;
    background:linear-gradient(135deg,var(--gold),#b8901f);
    color:#fff;border:none;border-radius:50px;
    padding:12px 18px;font-family:'Mukta',sans-serif;
    font-size:13px;font-weight:700;cursor:pointer;
    box-shadow:0 8px 24px rgba(201,162,39,.45),0 4px 10px rgba(0,0,0,.15);
    display:flex;align-items:center;gap:6px;
    transition:.25s;
  }
  .download-fab:active{transform:scale(.95)}
  .download-fab svg{width:16px;height:16px}
  .download-fab .fab-text{display:none}
  @media(min-width:400px){.download-fab .fab-text{display:inline}}

  /* ============ HERO ============ */
  .hero{
    position:relative;
    background:
      radial-gradient(circle at 20% 20%, rgba(201,162,39,.2), transparent 50%),
      radial-gradient(circle at 85% 70%, rgba(13,148,136,.2), transparent 50%),
      linear-gradient(135deg,#0f2942 0%,#1e3a5f 60%,#0f2942 100%);
    color:#fff;
    padding:calc(70px + var(--safe-top)) 20px 44px;
    overflow:hidden;
    margin-bottom:0;
  }
  .hero::before{
    content:'';position:absolute;inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
    background-size:44px 44px;
    pointer-events:none;
    z-index:1;
  }
  .hero-inner{
    position:relative;
    z-index:2;
    max-width:1100px;margin:0 auto;text-align:center;
  }
  .hero-badge{
    display:inline-flex;align-items:center;gap:6px;
    padding:6px 14px;border-radius:100px;
    background:rgba(201,162,39,.18);
    backdrop-filter:blur(8px);
    border:1px solid rgba(201,162,39,.4);
    color:var(--gold-light);font-size:11px;font-weight:700;
    letter-spacing:.4px;margin-bottom:16px;
    text-transform:uppercase;
  }
  .hero-badge .pulse{
    width:6px;height:6px;border-radius:50%;background:var(--gold);
    animation:pulse 2s infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1;transform:scale(1)}
    50%{opacity:.6;transform:scale(1.4)}
  }
  .hero h1{
    font-size:clamp(22px,6vw,34px);
    font-weight:800;line-height:1.25;
    margin-bottom:12px;letter-spacing:-.3px;
    text-shadow:0 2px 20px rgba(0,0,0,.35);
  }
  .hero h1 .accent{
    background:linear-gradient(135deg,var(--gold-light),var(--gold));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero p.lede{
    font-size:13px;
    color:rgba(255,255,255,.85);
    max-width:600px;margin:0 auto 20px;font-weight:400;
    line-height:1.6;
    text-shadow:0 1px 12px rgba(0,0,0,.3);
  }
  .hero-meta{
    display:flex;flex-wrap:wrap;justify-content:center;gap:8px;
    font-size:11px;color:rgba(255,255,255,.75);
  }
  .hero-meta span{
    display:flex;align-items:center;gap:4px;
    background:rgba(15,41,66,.6);
    backdrop-filter:blur(8px);
    padding:5px 10px;border-radius:100px;
    border:1px solid rgba(255,255,255,.15);
  }
  .hero-meta svg{width:12px;height:12px;opacity:.85}

  /* ============ STATS (SWIPEABLE) ============ */
  .stats-scroll{
    margin:-32px 0 0;position:relative;z-index:5;
    overflow-x:auto;overflow-y:hidden;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
    padding:8px 16px 12px;
    scrollbar-width:none;
  }
  .stats-scroll::-webkit-scrollbar{display:none}
  .stats-track{
    display:flex;gap:12px;
    min-width:max-content;
    padding-bottom:4px;
  }
  .stat-card{
    background:#fff;border-radius:16px;
    padding:16px 18px;box-shadow:var(--shadow-lg);
    border:1px solid var(--border);
    position:relative;overflow:hidden;
    min-width:160px;
    scroll-snap-align:start;
    flex-shrink:0;
  }
  .stat-card::before{
    content:'';position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--gold),var(--teal));
  }
  .stat-label{
    font-size:10px;color:var(--muted);font-weight:700;
    text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;
  }
  .stat-value{
    font-size:22px;font-weight:800;color:var(--navy);
    line-height:1.1;display:flex;align-items:baseline;gap:2px;
  }
  .stat-value small{font-size:12px;font-weight:600;color:var(--muted)}
  .stat-sub{font-size:10px;color:var(--muted);margin-top:4px}

  /* ============ SECTION ============ */
  .section{
    max-width:1200px;margin:0 auto;
    padding:32px 16px;
    scroll-margin-top:60px;
  }
  .section-header{
    display:flex;align-items:flex-start;gap:12px;
    margin-bottom:20px;padding-bottom:14px;
    border-bottom:2px solid var(--border);position:relative;
  }
  .section-header::after{
    content:'';position:absolute;bottom:-2px;left:0;
    width:60px;height:3px;
    background:linear-gradient(90deg,var(--gold),var(--teal));
    border-radius:2px;
  }
  .section-num{
    flex-shrink:0;
    width:40px;height:40px;border-radius:12px;
    background:linear-gradient(135deg,var(--navy),var(--navy-2));
    color:var(--gold-light);font-weight:800;font-size:14px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 16px rgba(15,41,66,.25);
    font-family:'Inter',sans-serif;
  }
  .section-title{
    font-size:19px;font-weight:800;color:var(--navy);
    line-height:1.25;
  }
  .section-title-en{
    font-size:10px;color:var(--muted);font-weight:700;
    text-transform:uppercase;letter-spacing:.8px;margin-top:2px;
  }

  /* ============ CARD ============ */
  .card{
    background:var(--card);border-radius:16px;
    border:1px solid var(--border);box-shadow:var(--shadow);
    padding:16px;margin-bottom:14px;
  }
  .card-title{
    font-size:14px;font-weight:700;color:var(--navy);
    margin-bottom:12px;display:flex;align-items:center;gap:8px;
  }
  .card-title .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--gold);
  }
  .card p{font-size:13.5px!important;line-height:1.7}

  .grid-2{display:grid;grid-template-columns:1fr;gap:12px}
  .grid-3{display:grid;grid-template-columns:1fr;gap:12px}
  @media(min-width:640px){
    .grid-2{grid-template-columns:1fr 1fr}
    .grid-3{grid-template-columns:repeat(3,1fr)}
  }

  /* ============ TABLES → CARDS ============ */
  .table-wrap{
    border-radius:14px;
    border:1px solid var(--border);
    background:#fff;
    box-shadow:var(--shadow-sm);
    overflow:hidden;
    margin-bottom:4px;
  }
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead{display:none}
  tbody tr{
    display:block;
    border-bottom:1px solid var(--border);
    padding:12px 14px;
    background:#fff;
  }
  tbody tr:last-child{border-bottom:none}
  tbody tr:nth-child(even){background:#fafbfc}
  tbody td{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    padding:4px 0;
    border:none;
    font-size:13px;
    gap:12px;
    text-align:right;
  }
  tbody td::before{
    content:attr(data-label);
    font-weight:700;
    color:var(--muted);
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:.3px;
    text-align:left;
    flex-shrink:0;
    max-width:45%;
  }
  tbody td.num{
    font-family:'Inter',sans-serif;
    font-variant-numeric:tabular-nums;
    font-weight:600;
    color:var(--navy);
  }
  tbody td:only-child{text-align:left}
  tbody td:only-child::before{content:'';display:none}

  tbody tr.total-row{
    background:linear-gradient(90deg,#fff8e6,#fff)!important;
  }
  tbody tr.total-row td{
    font-weight:700;color:var(--navy);
    border-top:1px dashed var(--gold);
    padding-top:8px;
  }
  tbody tr.total-row td::before{color:var(--navy)}
  tbody tr.total-row td:first-child{
    border-top:2px solid var(--gold);
    margin-top:4px;
  }
  tbody tr.grand-total{
    background:linear-gradient(135deg,var(--navy),var(--navy-2))!important;
    color:#fff!important;
    border-radius:10px;
    margin:6px 0;
  }
  tbody tr.grand-total td{
    color:#fff!important;font-weight:700;
    border:none;
  }
  tbody tr.grand-total td::before{color:var(--gold-light)!important}
  tbody tr.grand-total td.num{color:var(--gold-light)!important}

  @media(min-width:768px){
    thead{display:table-header-group}
    thead th{
      background:linear-gradient(135deg,var(--navy),var(--navy-2));
      color:#fff;font-weight:600;text-align:left;
      padding:12px 14px;font-size:12px;letter-spacing:.3px;
      white-space:nowrap;
    }
    table{font-size:13px}
    tbody tr{display:table-row;padding:0}
    tbody td{
      display:table-cell;
      text-align:left;
      padding:11px 14px;
      border-bottom:1px solid var(--border);
      font-size:13px;
    }
    tbody td::before{display:none}
    td.num,th.num{text-align:right}
    tbody tr.grand-total td{color:#fff!important;padding:14px}
    tbody tr.total-row td{border-top:2px solid var(--gold);padding:14px}
    tbody tr.total-row td:first-child{border-top:2px solid var(--gold);margin-top:0}
  }

  /* ============ PILL ============ */
  .pill{
    display:inline-block;padding:3px 9px;border-radius:100px;
    font-size:10px;font-weight:700;letter-spacing:.3px;
    text-transform:uppercase;
  }
  .pill-high{background:#fee2e2;color:#b91c1c}
  .pill-med{background:#fef3c7;color:#92400e}
  .pill-low{background:#d1fae5;color:#065f46}
  .pill-info{background:#dbeafe;color:#1e40af}

  /* ============ CHART ============ */
  .chart-card{
    background:#fff;border-radius:16px;
    border:1px solid var(--border);box-shadow:var(--shadow);
    padding:16px;margin-bottom:14px;
  }
  .chart-card h4{
    font-size:14px;font-weight:700;color:var(--navy);
    margin-bottom:4px;
  }
  .chart-card p.chart-sub{
    font-size:11px;color:var(--muted);margin-bottom:12px;
  }
  .chart-box{position:relative;height:240px}
  @media(min-width:768px){.chart-box{height:300px}}

  /* ============ CALLOUT ============ */
  .callout{
    border-left:4px solid var(--gold);
    background:linear-gradient(90deg,#fffbeb,#fff);
    padding:14px 16px;
    border-radius:0 12px 12px 0;
    margin:14px 0;
    font-size:13px;line-height:1.65;
  }
  .callout.teal{
    border-left-color:var(--teal);
    background:linear-gradient(90deg,#f0fdfa,#fff);
  }
  .callout.red{
    border-left-color:var(--red);
    background:linear-gradient(90deg,#fef2f2,#fff);
  }
  .callout strong{color:var(--navy)}

  /* ============ RISK ============ */
  .risk-list{display:flex;flex-direction:column;gap:10px}
  .risk-card{
    background:#fff;border-radius:14px;
    border:1px solid var(--border);
    padding:14px;
    box-shadow:var(--shadow-sm);
  }
  .risk-card-head{
    display:flex;justify-content:space-between;
    align-items:center;gap:10px;margin-bottom:8px;
  }
  .risk-card-title{
    font-size:13px;font-weight:700;color:var(--navy);
    flex:1;
  }
  .risk-card-pills{display:flex;gap:4px;flex-shrink:0}
  .risk-card-body{
    font-size:12px;color:var(--muted);
    line-height:1.6;
  }

  /* ============ GANTT ============ */
  .gantt{
    background:#fff;border-radius:14px;
    border:1px solid var(--border);
    box-shadow:var(--shadow);
    padding:12px;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
  }
  .gantt-grid{
    display:grid;
    grid-template-columns:140px repeat(6,60px);
    min-width:500px;
    font-size:11px;
  }
  .gantt-grid > div{
    padding:8px 4px;
    border-bottom:1px solid var(--border);
    display:flex;align-items:center;
    min-height:34px;
  }
  .gantt-head{
    background:linear-gradient(135deg,var(--navy),var(--navy-2));
    color:#fff;font-weight:700;font-size:10px;
    justify-content:center!important;
    letter-spacing:.3px;
    border-bottom:none!important;
    min-height:30px;
  }
  .gantt-head:first-child{
    justify-content:flex-start!important;
    padding-left:10px!important;
  }
  .gantt-label{
    font-weight:600;color:var(--navy);
    font-size:11px;line-height:1.3;
  }
  .gantt-bar{
    height:20px;border-radius:5px;
    background:linear-gradient(90deg,var(--teal),var(--teal-light));
    margin:2px;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:9px;font-weight:600;
  }
  .gantt-bar.gold{background:linear-gradient(90deg,var(--gold),var(--gold-light))}
  .gantt-bar.navy{background:linear-gradient(90deg,var(--navy),var(--navy-2))}
  .gantt-bar.violet{background:linear-gradient(90deg,var(--violet),#a78bfa)}
  .gantt-bar.orange{background:linear-gradient(90deg,var(--orange),#fb923c)}
  .gantt-bar.pink{background:linear-gradient(90deg,var(--pink),#f472b6)}

  /* ============ DISCLAIMER ============ */
  .disclaimer{
    background:linear-gradient(135deg,#fef2f2,#fff5f5);
    border:1px solid #fecaca;
    border-left:4px solid var(--red);
    border-radius:14px;
    padding:16px 18px;
    margin-top:14px;
    font-size:13px;
    color:#7f1d1d;
    line-height:1.7;
  }
  .disclaimer strong{color:#991b1b}

  /* ============ FOOTER ============ */
  .footer{
    background:linear-gradient(135deg,var(--navy),#0a1d30);
    color:rgba(255,255,255,.75);
    padding:32px 16px 24px;
    margin-top:24px;
  }
  .footer-inner{max-width:1200px;margin:0 auto}
  .footer h3{
    color:#fff;font-size:14px;font-weight:700;
    margin-bottom:8px;
  }
  .footer-grid{
    display:grid;grid-template-columns:1fr;
    gap:20px;margin-bottom:20px;
  }
  @media(min-width:640px){
    .footer-grid{grid-template-columns:repeat(3,1fr)}
  }
  .footer p{font-size:12px;line-height:1.7}
  .footer-bottom{
    border-top:1px solid rgba(255,255,255,.1);
    padding-top:16px;font-size:11px;
    text-align:center;color:rgba(255,255,255,.5);
    line-height:1.6;
  }

  /* ============ SCROLL REVEAL ============ */
  .reveal{opacity:0;transform:translateY(16px);transition:.5s ease}
  .reveal.visible{opacity:1;transform:none}

  /* ============ DESKTOP OVERRIDES ============ */
  @media(min-width:768px){
    body{padding-bottom:0;font-size:15px}
    .mobile-topbar{display:none}
    .bottom-nav{display:none}
    .hero{padding:80px 24px 100px}
    .hero h1{font-size:clamp(28px,4.5vw,52px)}
    .stats-scroll{
      margin-top:-60px;padding:0 24px;
      max-width:1200px;margin-left:auto;margin-right:auto;
      overflow:visible;
    }
    .stats-track{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
      min-width:auto;
    }
    .stat-card{min-width:auto;padding:22px 20px}
    .stat-value{font-size:26px}
    .stat-label{font-size:12px}
    .stat-sub{font-size:12px}
    .section{padding:60px 24px}
    .section-title{font-size:26px}
    .section-title-en{font-size:12px}
    .section-num{width:52px;height:52px;font-size:18px;border-radius:14px}
    .card{padding:24px;border-radius:16px}
    .card-title{font-size:16px}
    .download-fab{
      bottom:28px;right:28px;
      padding:16px 24px;font-size:15px;
    }
    .download-fab .fab-text{display:inline}
    .download-fab svg{width:20px;height:20px}
    .risk-list{display:none}
    .risk-table-desktop{display:block!important}
  }
  @media(max-width:767px){
    .risk-table-desktop{display:none!important}
  }

  /* ============ RISK TABLE (DESKTOP) ============ */
  .risk-row{
    display:grid;grid-template-columns:2fr 1fr 1fr 3fr;
    gap:12px;padding:14px;
    border-bottom:1px solid var(--border);
    align-items:center;font-size:13px;
  }
  .risk-row:last-child{border-bottom:none}
  .risk-head{
    background:linear-gradient(135deg,var(--navy),var(--navy-2));
    color:#fff;font-weight:700;font-size:12px;
    border-radius:10px 10px 0 0;
    border-bottom:none;
  }

  /* ============ PRINT / PDF ============ */
  @media print {
    @page { size: A4; margin: 10mm; }
